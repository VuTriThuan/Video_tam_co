<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tâm Cơ · Phòng điều hành</title>
<link rel="icon" href="/tep/assets/logo/tam-co-bieu-tuong.svg">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('giaodien')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
@font-face{font-family:"BVP";src:url(/tep/fonts/BeVietnamPro-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:"BVP";src:url(/tep/fonts/BeVietnamPro-Medium.ttf);font-weight:500 600;font-display:swap}
@font-face{font-family:"BVP";src:url(/tep/fonts/BeVietnamPro-Bold.ttf);font-weight:700;font-display:swap}
@font-face{font-family:"BVP";src:url(/tep/fonts/BeVietnamPro-ExtraBold.ttf);font-weight:800;font-display:swap}
@font-face{font-family:"Tay";src:url(/tep/fonts/PatrickHand-Regular.ttf);font-display:swap}
:root{--nen:#f3eee6;--mat:#fffdf9;--mat2:#f7f2ea;--muc:#1c1a18;--phu:#6e6860;--vien:rgba(28,26,24,.10);--vien2:rgba(28,26,24,.2);
  --do:#cf2f3b;--do-nhat:#fbe5e3;--xanh:#22804c;--xanh-nhat:#e0f1e6;--cam:#b86c0a;--cam-nhat:#fbeed6;--lam:#2f5d8f;--lam-nhat:#e3ecf6;
  --ray:#1c1a18;--ray-chu:#f3eee6;--ray-phu:#a39c92;--go:#d6b58a;--san:#ebe4d7;--bong:0 1px 2px rgba(28,26,24,.05),0 8px 24px -12px rgba(28,26,24,.18);
  --font:"BVP",-apple-system,"Segoe UI",Roboto,sans-serif;--w-ray:224px;--w-chat:392px}
:root[data-theme="dark"]{--nen:#111214;--mat:#1a1c20;--mat2:#212429;--muc:#ece8e1;--phu:#989289;--vien:rgba(255,255,255,.09);--vien2:rgba(255,255,255,.2);
  --do:#f2646d;--do-nhat:#3b1f23;--xanh:#5fc48e;--xanh-nhat:#19301f;--cam:#e8ab4c;--cam-nhat:#38290f;--lam:#86b3e6;--lam-nhat:#1b2a3c;
  --ray:#0a0b0c;--ray-chu:#ece8e1;--ray-phu:#7f7a72;--go:#6e5539;--san:#15171a;--bong:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);background:var(--nen);color:var(--muc);font-size:14.5px;line-height:1.55;display:grid;grid-template-columns:var(--w-ray) minmax(0,1fr) var(--w-chat);grid-template-rows:minmax(0,1fr);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--do);outline-offset:2px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- thanh bên ---------- */
.ray{background:var(--ray);color:var(--ray-chu);display:flex;flex-direction:column;padding:18px 12px 14px;gap:6px;min-height:0}
.hieu{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;text-decoration:none;color:inherit}
.hieu img{width:34px;height:44px;object-fit:contain}
.hieu b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hieu span{font-size:11.5px;color:var(--ray-phu)}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--ray-phu);padding:9px 10px;border-radius:10px;font-weight:500;text-align:left;transition:background .15s,color .15s}
#nav button:hover{color:var(--ray-chu);background:rgba(255,255,255,.06)}
#nav button.on{color:#fff;background:rgba(255,255,255,.1)}
#nav button.on svg{color:var(--do)}
#nav .so{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--do);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.ray-duoi{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.khau{font-family:"Tay";font-size:17px;line-height:1.2;color:var(--ray-phu);padding:0 6px}
.nho{background:none;border:1px solid rgba(255,255,255,.14);color:var(--ray-phu);border-radius:9px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px}
.nho:hover{color:var(--ray-chu)}

/* ---------- vùng chính ---------- */
main{overflow:auto;min-width:0}
#view{max-width:1040px;margin:0 auto;padding:30px 32px 80px}
.dau{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.dau h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.dau p{color:var(--phu);margin-top:3px}
.dau .phai{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
h3{font-size:14px;font-weight:700}
.the{background:var(--mat);border:1px solid var(--vien);border-radius:16px;padding:18px;box-shadow:var(--bong)}
.the+.the,.khoi+.khoi{margin-top:14px}
details.chot{display:block}
details.chot>summary{list-style:none;cursor:pointer}details.chot>summary::-webkit-details-marker{display:none}
details.chot>summary h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.chot>summary h2::after{content:"";width:8px;height:8px;border-right:2px solid var(--phu);border-bottom:2px solid var(--phu);transform:rotate(-45deg);transition:transform .15s;margin-left:6px}
details.chot[open]>summary h2::after{transform:rotate(45deg)}
details.chot[open]>summary{margin-bottom:14px}
details.chot .ai{margin-left:auto;font-weight:400}
details.chot .luoi{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.the>h2{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.luoi{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.hang{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mo{color:var(--phu);font-size:13px}
.nut{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--vien2);background:var(--mat);border-radius:10px;padding:7px 13px;font-weight:600;font-size:13.5px;transition:transform .08s,background .15s,border-color .15s;white-space:nowrap}
.nut:hover{border-color:var(--muc)}
.nut:active{transform:translateY(1px)}
.nut.chinh{background:var(--do);border-color:var(--do);color:#fff}
.nut.chinh:hover{filter:brightness(1.07)}
.nut.den{background:var(--muc);border-color:var(--muc);color:var(--nen)}
.nut.be{padding:4px 9px;font-size:12.5px;border-radius:8px}
.nut:disabled{opacity:.5;cursor:default}
.nut svg.ic{width:16px;height:16px}
select,textarea,input[type=text]{background:var(--mat2);border:1px solid var(--vien2);border-radius:10px;padding:8px 11px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
.the-nhan{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--mat2);border:1px solid var(--vien);color:var(--phu);white-space:nowrap}
.the-nhan.do{background:var(--do-nhat);color:var(--do);border-color:transparent}
.the-nhan.xanh{background:var(--xanh-nhat);color:var(--xanh);border-color:transparent}
.the-nhan.cam{background:var(--cam-nhat);color:var(--cam);border-color:transparent}
.the-nhan.lam{background:var(--lam-nhat);color:var(--lam);border-color:transparent}
video{width:100%;max-height:68vh;background:#000;border-radius:12px;display:block}
pre.ra{background:var(--mat2);border:1px solid var(--vien);border-radius:10px;padding:12px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;margin-top:10px;font-family:ui-monospace,Menlo,monospace}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--vien);padding:6px 8px;text-align:left}th{color:var(--phu);font-weight:600}

/* ---------- việc cần sếp ---------- */
.can{display:flex;gap:18px;align-items:center;border-radius:18px;padding:20px 22px;background:var(--mat);border:1px solid var(--vien);box-shadow:var(--bong);position:relative;overflow:hidden}
.can::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--phu)}
.can.goi{background:linear-gradient(100deg,var(--do-nhat),var(--mat) 62%)}.can.goi::before{background:var(--do)}
.can.chay::before{background:var(--xanh)}
.can .nhan{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--phu)}
.can.goi .nhan{color:var(--do)}.can.chay .nhan{color:var(--xanh)}
.can h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.can .giua{flex:1;min-width:0}
.thanh{height:6px;border-radius:3px;background:var(--vien);overflow:hidden;margin-top:10px;max-width:420px}
.thanh i{display:block;height:100%;background:var(--xanh);border-radius:3px;transition:width .5s}
.nhip{width:10px;height:10px;border-radius:50%;background:var(--xanh);display:inline-block;animation:nhip 1.4s infinite}
@keyframes nhip{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--xanh) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* ---------- các bước ---------- */
.buoc{display:flex;gap:0;margin-top:14px;overflow:auto;padding:4px 2px 2px}
.buoc li{list-style:none;flex:1;min-width:112px;position:relative;padding-top:26px;font-size:12.5px;color:var(--phu)}
.buoc li::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--vien2)}
.buoc li::after{content:"";position:absolute;top:2px;left:0;width:14px;height:14px;border-radius:50%;background:var(--mat);border:2px solid var(--vien2)}
.buoc li.xong::before,.buoc li.xong::after{background:var(--xanh);border-color:var(--xanh)}
.buoc li.nay::after{background:var(--do);border-color:var(--do);box-shadow:0 0 0 4px var(--do-nhat)}
.buoc li b{display:block;color:var(--muc);font-size:13.5px}
.buoc li.nay b{color:var(--do)}
.buoc li em{font-style:normal;display:inline-block;margin-top:3px;font-size:10.5px;font-weight:700;color:var(--do);border:1px solid currentColor;border-radius:999px;padding:0 6px}

/* ---------- văn phòng 2D ---------- */
.vp{border:1px solid var(--vien);border-radius:20px;overflow:hidden;box-shadow:var(--bong);background:var(--san)}
.vp-tuong{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--mat);border-bottom:5px solid var(--go)}
.vp-tuong .bang{font-weight:800;letter-spacing:.14em;font-size:13px}
.vp-tuong .bang i{font-style:normal;color:var(--do)}
.vp-tuong .cau{font-family:"Tay";font-size:17px;color:var(--phu)}
.vp-tuong .gio{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;border:2px solid var(--muc);border-radius:999px;padding:1px 10px}
.vp-san{padding:18px;display:flex;flex-wrap:wrap;gap:14px;background-image:linear-gradient(var(--vien) 1px,transparent 1px),linear-gradient(90deg,var(--vien) 1px,transparent 1px);background-size:46px 46px;background-position:-1px -1px}
.khu{flex:1 1 auto;background:color-mix(in srgb,var(--mat) 86%,transparent);border:1.5px dashed var(--vien2);border-radius:16px;padding:30px 8px 12px;position:relative;display:flex;justify-content:space-evenly;gap:4px}
.khu>label{position:absolute;top:9px;left:14px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--phu)}
.tram{width:138px;display:flex;flex-direction:column;align-items:center;position:relative;padding-top:32px;border:0;background:none;text-align:center}
.tram .bong{position:absolute;top:0;left:50%;max-width:156px;transform:translate(-50%,5px);font:15.5px/1.2 "Tay";background:var(--mat);border:1.5px solid var(--muc);border-radius:11px;padding:2px 9px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s,transform .25s;z-index:3}
.tram[data-tt=lam] .bong,.tram[data-tt=cho] .bong,.tram[data-tt=loi] .bong{opacity:1;transform:translate(-50%,0)}
.tram[data-tt=cho] .bong{border-color:var(--cam);color:var(--cam)}
.tram[data-tt=loi] .bong{border-color:var(--do);color:var(--do)}
.nguoi{border-radius:50%;overflow:hidden;flex:none;display:block}
.nguoi svg{display:block;width:100%;height:100%}
.tram .nguoi{width:64px;height:64px;box-shadow:0 0 0 3px var(--mat),0 0 0 4.5px var(--vien2);transition:filter .3s,opacity .3s,transform .3s}
.tram[data-tt=lam] .nguoi{box-shadow:0 0 0 3px var(--mat),0 0 0 5px var(--xanh);animation:gat 1.6s ease-in-out infinite}
.tram[data-tt=cho] .nguoi{box-shadow:0 0 0 3px var(--mat),0 0 0 5px var(--cam)}
.tram[data-tt=off] .nguoi{filter:grayscale(1);opacity:.32}
@keyframes gat{50%{transform:translateY(2px)}}
.tram .ban{width:118px;height:36px;margin-top:-15px;position:relative;z-index:2}
.tram .ban::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:5px;background:var(--go);box-shadow:0 3px 0 rgba(0,0,0,.13)}
.tram .mh{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:50px;height:30px;border-radius:6px;background:#23262b;border:2.5px solid #3a3e46;padding:5px 6px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.tram .mh i{display:block;height:2.5px;border-radius:2px;background:#3a3e46;width:100%}
.tram .mh i:nth-child(2){width:70%}.tram .mh i:nth-child(3){width:45%}
.tram[data-tt=lam] .mh{background:#12261b;border-color:#2c5a40}
.tram[data-tt=lam] .mh i{background:#6fe0a0;animation:go 1.1s infinite}
.tram[data-tt=lam] .mh i:nth-child(2){animation-delay:.2s}.tram[data-tt=lam] .mh i:nth-child(3){animation-delay:.4s}
.tram[data-tt=cho] .mh i,.tram[data-tt=onl] .mh i{background:#596070}
@keyframes go{0%,100%{opacity:.35}50%{opacity:1}}
.tram .bien{margin-top:7px;line-height:1.25}
.tram .bien b{display:block;font-size:13.5px;font-weight:700}
.tram .bien span{display:block;font-size:11.5px;color:var(--phu)}
.tram .tt{font-size:11px;font-weight:700;margin-top:3px;color:var(--phu)}
.tram[data-tt=lam] .tt{color:var(--xanh)}.tram[data-tt=cho] .tt{color:var(--cam)}.tram[data-tt=loi] .tt{color:var(--do)}
.thu{position:fixed;z-index:60;width:22px;height:16px;border-radius:4px;background:var(--mat);border:2px solid var(--do);pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.thu::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 46%,var(--do) 47%,var(--do) 53%,transparent 54%),linear-gradient(to top left,transparent 46%,var(--do) 47%,var(--do) 53%,transparent 54%);background-size:50% 70%;background-repeat:no-repeat;background-position:left top,right top}

/* ---------- văn phòng 3D ---------- */
.vp3d{position:relative;height:clamp(440px,60vh,640px);overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;
  background:radial-gradient(120% 90% at 50% 18%,#fff6e6 0%,#f6dfc4 42%,#e9bfa2 100%)}
.vp3d.dem{background:radial-gradient(120% 90% at 50% 12%,#2b3260 0%,#171a35 48%,#0b0c18 100%)}
.vp3d.keo{cursor:grabbing}
.vp3d canvas{display:block;width:100%;height:100%}
.vp3d-nhan{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.nhan3d{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;pointer-events:auto;cursor:pointer;will-change:transform;text-align:center;padding:0}
.nhan3d .ten{background:color-mix(in srgb,var(--mat) 90%,transparent);border:1px solid var(--vien);border-radius:10px;padding:3px 9px 4px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);line-height:1.2;transition:transform .15s,border-color .15s}
.nhan3d b{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap}
.nhan3d b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--phu);flex:none}
.nhan3d i{display:block;font-style:normal;font-size:10.5px;color:var(--phu);white-space:nowrap}
.nhan3d[data-tt=lam] b::before{background:var(--xanh);box-shadow:0 0 0 3px color-mix(in srgb,var(--xanh) 30%,transparent)}
.nhan3d[data-tt=cho] b::before{background:var(--cam)}.nhan3d[data-tt=loi] b::before{background:var(--do)}
.nhan3d[data-tt=off] .ten{opacity:.55}
.nhan3d.ro .ten,.nhan3d:hover .ten{border-color:var(--muc);transform:translateY(-2px)}
.nhan3d .bong{display:none;max-width:190px;font:15.5px/1.2 "Tay";background:var(--mat);border:1.5px solid var(--muc);border-radius:11px;padding:2px 9px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhan3d[data-tt=lam] .bong:not(:empty),.nhan3d[data-tt=cho] .bong:not(:empty),.nhan3d[data-tt=loi] .bong:not(:empty){display:block}
.nhan3d[data-tt=cho] .bong{border-color:var(--cam);color:var(--cam)}.nhan3d[data-tt=loi] .bong{border-color:var(--do);color:var(--do)}
.vp-cho{height:clamp(440px,60vh,640px);display:grid;place-items:center;color:var(--phu)}
.ds-gon{display:none;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:var(--mat)}
.ds-gon button{display:flex;align-items:center;gap:8px;border:1px solid var(--vien);background:var(--mat2);border-radius:10px;padding:5px 8px;text-align:left;min-width:0}
.ds-gon .nguoi{width:28px;height:28px}
.ds-gon b{display:block;font-size:12.5px;line-height:1.2}.ds-gon i{display:block;font-style:normal;font-size:10.5px;color:var(--phu);line-height:1.2}
.ds-gon span.c{min-width:0}.ds-gon [data-tt=lam] b{color:var(--xanh)}.ds-gon [data-tt=cho] b{color:var(--cam)}.ds-gon [data-tt=off]{opacity:.5}
@media (max-width:760px){.vp3d,.vp-cho{height:340px}.nhan3d i,.vp-goi,.vp-tuong .cau{display:none}.nhan3d b{font-size:11px}.nhan3d .ten{padding:2px 6px}.nhan3d .bong{max-width:120px;font-size:13px}.ds-gon{display:grid}.vp-tuong{padding:10px 14px;gap:8px}}
.vp-goi{position:absolute;left:14px;bottom:10px;font-size:11.5px;color:var(--phu);pointer-events:none;background:color-mix(in srgb,var(--mat) 70%,transparent);padding:2px 8px;border-radius:8px}

/* ---------- thẻ video / chủ đề / nhân sự ---------- */
.bia{aspect-ratio:9/16;border-radius:12px;background:var(--mat2) center/cover;border:1px solid var(--vien)}
.vd{display:flex;gap:12px;align-items:center;background:var(--mat);border:1px solid var(--vien);border-radius:14px;padding:10px;text-align:left;width:100%}
.vd:hover{border-color:var(--vien2)}
.vd .bia{width:54px;flex:none;border-radius:8px}
.vd b{display:block;font-size:13.5px;line-height:1.3}
.cd{display:flex;flex-direction:column;gap:9px}
.cd .so{font-family:"Tay";font-size:24px;line-height:1;color:var(--do)}
.cd h3{font-size:15px;line-height:1.35}
.cd blockquote{font-family:"Tay";font-size:18px;line-height:1.25;border-left:3px solid var(--do);padding-left:10px}
.cd.xong{opacity:.62}
.doan{display:inline-flex;border:1px solid var(--vien2);border-radius:9px;overflow:hidden}
.doan button{border:0;background:none;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--phu)}
.doan button.on{background:var(--muc);color:var(--nen)}
.ns{display:flex;flex-direction:column;gap:10px}
.ns .tren{display:flex;gap:14px;align-items:center}
.ns .nguoi{width:68px;height:68px}
.ns h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.ns .cdanh{color:var(--do);font-weight:700;font-size:13px}
.ns dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.ns dt{color:var(--phu)}
.ns .sk{display:flex;flex-direction:column;gap:6px}

.chat-tab button.on{background:var(--mat2);color:var(--muc)}
#luong{flex:1;overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;min-height:0}
.tn{max-width:92%;display:flex;flex-direction:column;gap:2px}
.tn .gio{font-size:11px;color:var(--phu)}
.tn .nd{background:var(--mat2);border:1px solid var(--vien);border-radius:4px 14px 14px 14px;padding:8px 12px;word-break:break-word;font-size:14px}
.tn.toi{align-self:flex-end;align-items:flex-end}
.tn.toi .nd{background:var(--do);border-color:var(--do);color:#fff;border-radius:14px 4px 14px 14px;white-space:pre-wrap}
.tn .nd.gon{max-height:13em;overflow:hidden;cursor:pointer;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.noi-bo{font-size:12px;color:var(--phu);display:flex;gap:7px;align-items:center;background:none;border:0;text-align:left;padding:1px 2px;width:100%}
.noi-bo .nguoi{width:18px;height:18px}
.noi-bo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.td{display:flex;gap:10px}
.td .nguoi{width:32px;height:32px;margin-top:2px}
.td .than{min-width:0;flex:1}
.td .ai{font-size:12px;color:var(--phu)}.td .ai b{color:var(--muc);font-size:13px}
.td .nd{font-size:13.5px;word-break:break-word;white-space:pre-wrap}
.td .nd.gon{max-height:7.5em;overflow:hidden;cursor:pointer;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
#hd{padding:4px 16px;font-size:12.5px;color:var(--xanh);min-height:26px;display:flex;align-items:center;gap:8px;overflow:hidden}
#hd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soan{border-top:1px solid var(--vien);padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.goi-y{display:flex;gap:6px;overflow:auto;padding-bottom:8px;scrollbar-width:none}
.goi-y button{flex:none;border:1px solid var(--vien2);background:none;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;color:var(--phu)}
.goi-y button:hover{color:var(--muc);border-color:var(--muc)}
.o{display:flex;gap:8px;align-items:flex-end;background:var(--mat2);border:1px solid var(--vien2);border-radius:14px;padding:6px 6px 6px 12px}
.o:focus-within{border-color:var(--do)}
.o textarea{border:0;background:none;padding:5px 0;min-height:26px;max-height:160px;resize:none;outline:none}
.o button{width:36px;height:36px;border-radius:10px;border:0;background:var(--do);color:#fff;display:grid;place-items:center;flex:none}
.o button.dung{background:var(--muc);color:var(--nen)}
.soan .duoi{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--phu)}
.soan .duoi button{border:0;background:none;color:var(--phu);font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
#fab{display:none;position:fixed;right:18px;bottom:18px;z-index:30;width:54px;height:54px;border-radius:50%;border:0;background:var(--do);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.28);place-items:center}
#fab .so{position:absolute;top:-2px;right:-2px;background:var(--muc);color:var(--nen);font-size:11px;font-weight:700;border-radius:10px;min-width:20px;height:20px;display:grid;place-items:center}

/* ---------- lớp nổi ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--muc);color:var(--nen);padding:9px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw}
#toast.hien{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:80;padding:20px}
#modal.hien{display:grid}
#modal .hop{background:var(--mat);border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#modal h2{font-size:18px;margin-bottom:6px}
#modal .hang{justify-content:flex-end;margin-top:18px}

@media (max-width:1240px){
  body{grid-template-columns:var(--w-ray) minmax(0,1fr)}
  .chat{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:50;transform:translateX(105%);transition:transform .25s;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
  body.mo-chat .chat{transform:none}
  .chat-dau .x{display:inline-flex}
  #fab{display:grid}body.mo-chat #fab{display:none}
}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .ray{order:2;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom));overflow-x:auto}
  .hieu,.ray-duoi{display:none}
  #nav{flex-direction:row;gap:2px;width:100%;justify-content:space-between}
  #nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;position:relative;white-space:nowrap}
  #nav .so{position:absolute;top:2px;right:6px;margin:0}
  #view{padding:20px 16px 90px}.dau h1{font-size:23px}
  #fab{bottom:76px}
  .can{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside class="ray">
  <a class="hieu" href="#ban"><img src="/tep/assets/logo/tam-co-bieu-tuong.svg" alt=""><div><b>Tâm Cơ</b><span>Phòng điều hành</span></div></a>
  <nav id="nav"></nav>
  <div class="ray-duoi">
    <div class="khau">Hiểu chiêu để không trúng chiêu.</div>
    <div id="nhac-o"></div>
    <button class="nho" id="giaodien"></button>
  </div>
</aside>

<main><div id="view"></div></main>

<aside class="chat" id="chat">
  <div class="chat-dau"><span class="nguoi" id="chat-av"></span><div><b id="chat-ten"></b><span id="chat-tt"></span></div><button class="nut be x" id="dong-chat">Đóng</button></div>
  <div class="chat-tab"><button data-ct="hai" class="on">Với anh Hải</button><button data-ct="doi">Cả đội</button></div>

</aside>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const api=(u,o)=>fetch(u,o).then(r=>r.json());
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gio=ts=>new Date(ts*1000).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
const PCTEN={'bang-trang':'Bảng trắng','truyen-tranh':'Truyện tranh','tranh-tinh-zoom':'Tranh điện ảnh'};
const TT={lam:'Đang làm',onl:'Sẵn sàng',cho:'Chờ sếp',off:'Vắng',loi:'Gặp lỗi'};
const S={doi:[],nv:{},hienTai:{},tienDo:null,phien:{},can:null,duAn:[],tin:[],view:'ban',ct:'hai',chuaDoc:0};

/* ---------- biểu tượng ---------- */
const IC={ban:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 chude:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
 duyet:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
 dangbai:'<path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/>',
 phantich:'<path d="M5 20V11M11 20V4M17 20v-7M2 20h20"/>',
 doingu:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.3c2.2.8 3.5 2.9 3.5 5.7"/>',
 bangiao:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 13l2 2 4-4"/>',
 nhansu:'<path d="M12 3l2.200 4.600 5 .700-3.600 3.500.900 5-4.500-2.400-4.500 2.400.900-5L4.800 8.300l5-.700z"/>',
 luong:'<circle cx="6" cy="6" r="2.500"/><circle cx="18" cy="12" r="2.500"/><circle cx="6" cy="18" r="2.500"/><path d="M8.500 6H12a3 3 0 0 1 3 3v.500M8.500 18H12a3 3 0 0 0 3-3v-.500"/>',
 thuvien:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><path d="M17 14v6M14 17h6"/>',
 hethong:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',gui:'<path d="M12 19V5M6 11l6-6 6 6"/>',dung:'<rect x="7" y="7" width="10" height="10" rx="2"/>',
 trang:'<path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/>',tai:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',toi:'<path d="M9 6l6 6-6 6"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- chân dung 2D: mỗi nhân viên một kiểu tóc ---------- */
const DANG={'dai-ca':['vuot','#f0c9a0',0],'truong-nhom':['ngan','#eec39a',1],'len-chu-de':['dai','#f3d0ad',0],'bien-kich':['roi','#e9bb8f',1],'kiem-duyet':['bui','#f1cba6',1],'hoa-si':['mu','#e6b78a',0],'dong-goi':['bob','#f4d3b3',0],'phan-tich':['dinh','#e3b081',0]};
const TOC={ngan:'M18.5 27c-1.5-10 5-17 13.5-17s15 7 13.5 17c-2-5-5-8-13.5-8s-11.500 3-13.500 8z',
 vuot:'M18.500 27c-2-11 6-18 15-17 8 1 13 8 12 17-2-6-5-9-9-10-6 3-13 3-18 10z',
 roi:'M18.500 28c-3-9 2-18 12-18 2-3 7-2 7 1 6 1 10 7 8 17-1-5-4-8-6-9-4 3-12 3-15 0-3 2-5 5-6 9z',
 dinh:'M19 25c-1-9 5-15 13-15s14 6 13 15c-2-4-5-6-13-6s-11 2-13 6z',
 dai:'M17 47V27c0-11 6.500-17 15-17s15 6 15 17v20c-3 0-6-2-6-6V27c-2-5-5-7-9-7s-7 2-9 7v14c0 4-3 6-6 6z',
 bob:'M17 38V27c0-11 6.500-17 15-17s15 6 15 17v11h-6V27c-2-5-5-7-9-7s-7 2-9 7v11z',
 bui:'M18.500 27c-1.500-10 5-17 13.500-17s15 7 13.500 17c-2-5-5-8-13.500-8s-11.500 3-13.500 8z',
 mu:'M19 26c-1-6 2-10 5-12h16c3 2 6 6 5 12-2-4-5-6-13-6s-11 2-13 6z'};
function chanDung(id){
  const m=S.doi.find(x=>x.id===id)||{mau:'#888'};
  if(id==='may-dung')return `<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="${m.mau}" opacity=".22"/><path d="M10 64c0-12 9-18 22-18s22 6 22 18z" fill="${m.mau}"/><rect x="29" y="38" width="6" height="9" fill="#8b95a5"/><rect x="16" y="14" width="32" height="26" rx="7" fill="#cfd6e0"/><rect x="20" y="19" width="24" height="13" rx="4" fill="#23262b"/><circle cx="27" cy="25.500" r="2.600" fill="#6fe0a0"/><circle cx="37" cy="25.500" r="2.600" fill="#6fe0a0"/><path d="M32 14V8" stroke="#8b95a5" stroke-width="2.500"/><circle cx="32" cy="7" r="3" fill="#cf2f3b"/><rect x="26" y="34.500" width="12" height="2" rx="1" fill="#8b95a5"/></svg>`;
  const h=[...id].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),[kieu,da,kinh]=DANG[id]||[['ngan','dinh','roi','bob','dai','bui'][h%6],['#f0c9a0','#e9bb8f','#f3d0ad','#e3b081'][(h>>3)%4],(h>>5)%3===0?1:0], toc=id==='kiem-duyet'?'#5a3a32':id==='dong-goi'?'#3b2a22':id==='len-chu-de'?'#2a1d1a':DANG[id]?'#1f1b1a':['#1f1b1a','#3b2a22','#5a3a32'][(h>>7)%3];
  return `<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="${m.mau}" opacity=".22"/>
   ${kieu==='dai'||kieu==='bob'?`<path d="${TOC[kieu]}" fill="${toc}"/>`:''}
   <path d="M9 64c0-13 10-19 23-19s23 6 23 19z" fill="${m.mau}"/>
   <path d="M27 40h10v6c0 3-10 3-10 0z" fill="${da}" style="filter:brightness(.88)"/>
   ${id==='truong-nhom'||id==='dai-ca'?'<path d="M26 45.500l6 5 6-5 2 3-8 9-8-9z" fill="#fff" opacity=".92"/><path d="M32 50l2 3-2 9-2-9z" fill="#1c1a18"/>':''}
   <circle cx="32" cy="28" r="13.500" fill="${da}"/>
   ${kieu==='dai'||kieu==='bob'?`<path d="M18.500 27c-1.500-10 5-17 13.500-17s15 7 13.500 17c-3-5-7-7-13.500-7s-10.500 2-13.500 7z" fill="${toc}"/>`:`<path d="${TOC[kieu]}" fill="${toc}"/>`}
   ${kieu==='bui'?`<circle cx="32" cy="8.500" r="5.500" fill="${toc}"/>`:''}
   ${kieu==='mu'?`<path d="M14 17c2-9 12-11 20-10 8 1 15 4 15 9 0 3-8 3-18 3s-18 2-17-2z" fill="#cf2f3b"/><circle cx="35" cy="5.500" r="2" fill="#cf2f3b"/>`:''}
   <circle cx="27" cy="29" r="1.700" fill="#1c1a18"/><circle cx="37" cy="29" r="1.700" fill="#1c1a18"/>
   <path d="M28 34.500q4 3 8 0" stroke="#1c1a18" stroke-width="1.600" fill="none" stroke-linecap="round"/>
   ${kinh?'<g stroke="#1c1a18" stroke-width="1.500" fill="none"><circle cx="27" cy="29" r="4.300"/><circle cx="37" cy="29" r="4.300"/><path d="M31.300 29h1.400"/></g>':''}</svg>`;}
const av=id=>`<span class="nguoi">${chanDung(id)}</span>`;
const nv=id=>S.doi.find(x=>x.id===id)||{ten:id,chuc_danh:''};
const hoTen=id=>{const m=nv(id);return m.chuc_danh?`${m.ten} · ${m.chuc_danh}`:m.ten;};

/* ---------- markdown tối giản, có nút sao chép từng dòng ---------- */
function md(t,chep){
  const dong=String(t||'').split('\n');let h='',ds=null,code=null;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const nut=s=>chep?`<button class="chep" data-chep="${esc(s)}">Sao chép</button>`:'';
  const dong_ds=()=>{if(ds){h+=`</${ds}>`;ds=null;}};
  for(const d of dong){
    if(code!==null){if(/^```/.test(d)){h+=`<pre><code>${esc(code)}</code></pre>`;code=null;}else code+=(code?'\n':'')+d;continue;}
    if(/^```/.test(d)){dong_ds();code='';continue;}
    let m;
    if((m=d.match(/^(#{1,3})\s+(.*)/))){dong_ds();h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;continue;}
    if((m=d.match(/^\s*[-*]\s+(.*)/))){if(ds!=='ul'){dong_ds();h+='<ul>';ds='ul';}h+=`<li>${inl(m[1])}${nut(m[1].replace(/\*\*/g,''))}</li>`;continue;}
    if((m=d.match(/^\s*\d+[.)]\s+(.*)/))){if(ds!=='ol'){dong_ds();h+='<ol>';ds='ol';}h+=`<li>${inl(m[1])}${nut(m[1].replace(/\*\*/g,''))}</li>`;continue;}
    dong_ds();if(d.trim())h+=`<p>${inl(d)}${nut(d.replace(/\*\*/g,''))}</p>`;
  }
  if(code!==null)h+=`<pre><code>${esc(code)}</code></pre>`;
  dong_ds();return h;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-chep]');if(!b)return;navigator.clipboard.writeText(b.dataset.chep).then(()=>bao('Đã chép'));});

/* ---------- thông báo, hỏi lại ---------- */
let henBao;function bao(t){const e=$('#toast');e.textContent=t;e.classList.add('hien');clearTimeout(henBao);henBao=setTimeout(()=>e.classList.remove('hien'),2600);}
function hoi(td,nd,ok='Đồng ý'){return new Promise(r=>{$('#m-td').textContent=td;$('#m-nd').textContent=nd;$('#m-ok').textContent=ok;$('#modal').classList.add('hien');
  const xong=v=>{$('#modal').classList.remove('hien');$('#m-ok').onclick=$('#m-huy').onclick=null;r(v);};$('#m-ok').onclick=()=>xong(true);$('#m-huy').onclick=()=>xong(false);});}

/* ---------- ra lệnh cho anh Hải ---------- */
async function lenh(noi,moi){
  const r=await post('/api/lenh',{noi,moi:!!moi});
  if(r.loi){bao(r.loi);return false;}
  bao(r.xep_hang?`Anh Hải đang bận, đã xếp hàng (${r.xep_hang})`:'Đã gửi anh Hải');
  if(innerWidth<=1240)document.body.classList.add('mo-chat');
  return true;
}

/* ---------- điều hướng ---------- */
const MUC=[['ban','Bàn làm việc'],['chude','Chủ đề'],['duyet','Duyệt'],['dangbai','Đăng bài'],['phantich','Phân tích'],['doingu','Đội ngũ'],['bangiao','Bàn giao'],['nhansu','Skill & nhân sự'],['luong','Luồng làm việc'],['thuvien','Thư viện'],['hethong','Hệ thống']];
function veNav(){
  const chuaDang=S.duAn.filter(d=>d.xuat_ban).reduce((n,d)=>n+Math.max(0,d.so_muc-Object.keys(d.da_dang||{}).length),0);
  const so={duyet:S.can?.loai?1:0,dangbai:chuaDang,thuvien:S.khoiCho||0};
  $('#nav').innerHTML=MUC.map(([k,t])=>`<button data-v="${k}" class="${S.view===k?'on':''}">${ic(k)}<span>${t}</span>${so[k]?`<i class="so" style="font-style:normal">${so[k]}</i>`:''}</button>`).join('');
  {const n=(S.can?.loai?1:0)+(S.khoiCho?1:0);document.title=(n?`(${n}) `:'')+'Tâm Cơ · Phòng điều hành';}
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)mo(b.dataset.v);};
const VE={};
function mo(v,giu){if(!VE[v])v='ban';if(v!=='ban')VP?.chay(false);S.view=v;if(!giu)history.replaceState(null,'','#'+v);veNav();$('main').scrollTop=0;VE[v]();}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==S.view)mo(v,1);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-mo]');if(b)mo(b.dataset.mo);const l=e.target.closest('[data-lenh]');if(l)lenh(l.dataset.lenh,l.dataset.moi==='1');});

/* ---------- nạp dữ liệu ---------- */
async function napTT(){const r=await api('/api/trang-thai');for(const n of r.nhan_vien)S.nv[n.id]=n;S.hienTai=r.hien_tai||{};S.tienDo=r.tien_do;S.phien=r.phien||{};S.can=r.can_duyet;S.khoiCho=r.khoi_cho||0;capNhat();}
async function napDuAn(){const r=await api('/api/du-an');S.duAn=r.ds;veNav();}
async function napTin(){const r=await api('/api/ban-tin');S.tin=r.ds;veLuong();}
function capNhat(){veNav();veChatDau();veBanDong();kiemBao();}
// âm báo: so trạng thái mới với lần trước (lần nạp đầu chỉ ghi nhớ, không kêu)
let baoTruoc=null,hBatDau=0;
function kiemBao(){const p=S.tienDo,n={can:S.can?.loai?S.can.loai+'|'+S.can.slug:'',chay:!!S.phien?.dang_chay,dung:p?(p.phan_tram>=100?'xong|'+p.viec:'lam'):''};
  const t=baoTruoc;baoTruoc=n;if(n.chay&&!t?.chay)hBatDau=Date.now();if(!t||!window.NHAC)return;

function bayThu(tu,den){if(S.view!=='ban'||document.hidden)return;if(VP&&$('#b-vp .vp3d')){VP.bayThu(tu,den);return;}const a=$(`.tram[data-id="${tu}"] .nguoi`),b=$(`.tram[data-id="${den}"] .nguoi`);if(!a||!b)return;
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),e=document.createElement('i');e.className='thu';document.body.append(e);
  const x0=ra.left+ra.width/2-11,y0=ra.top+ra.height/2-8,x1=rb.left+rb.width/2-11,y1=rb.top+rb.height/2-8;
  e.animate([{transform:`translate(${x0}px,${y0}px) scale(.4)`,opacity:0},{transform:`translate(${x0}px,${y0-18}px) scale(1)`,opacity:1,offset:.15},{transform:`translate(${x1}px,${y1-18}px) scale(1)`,opacity:1,offset:.85},{transform:`translate(${x1}px,${y1}px) scale(.4)`,opacity:0}],{duration:1300,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>e.remove();}

const BG_THU=['len-chu-de','bien-kich','kiem-duyet','hoa-si','may-dung','dong-goi','phan-tich'];
const BG_CHOT={'kich-ban':'Chốt 1 · kịch bản','phong-cach':'Chốt 2 · phong cách','nhap':'Chốt 3 · bản nháp'};
const bgThoi=s=>s<60?Math.round(s)+' giây':s<3600?Math.round(s/60)+' phút':(s/3600).toFixed(1).replace('.',',')+' giờ';
function bgTinh(n){
  const giao=[...n.giao].sort((a,b)=>a.ts-b.ts),nop=[...n.nop].sort((a,b)=>a.ts-b.ts);
  const luot=giao.map((g,i)=>{const het=giao[i+1]?.ts??Infinity,x=nop.find(t=>t.ts>=g.ts&&t.ts<het);return {giao:g,nop:x};});
  const tong=luot.reduce((s,l)=>s+(l.nop?l.nop.ts-l.giao.ts:0),0),g1=giao.at(-1),n1=nop.at(-1),du=n.tep.length&&n.tep.every(t=>t.co);
  const tt=n1&&(!g1||n1.ts>=g1.ts)?['Đã bàn giao','xanh']:du?['Có kết quả, chưa báo cáo','cam']:['Đang làm','lam'];
  return {giao,nop,luot,tong,g1,n1,tt,cuoi:Math.max(g1?.ts||0,n1?.ts||0)};
}

     <div class="bg-luoi">${Object.entries(x.nguoi).filter(([id])=>!S.bgNguoi||id===S.bgNguoi).sort(([a],[b])=>thu(a)-thu(b)).map(([id,n])=>bgThe(id,n)).join('')}</div></div>`).join(''):'<div class="the"><p class="mo">Chưa có việc nào khớp bộ lọc.</p></div>'}`;
  $('#bg-chon').onchange=e=>{S.bgChon=e.target.value;VE.bangiao();};

/* ================= SKILL & NHÂN SỰ — ghi thật vào .claude/agents, .claude/skills, doi-ngu.json ================= */
const NS_MAU=['#3d5a80','#e07a5f','#5f8f74','#b5838d','#c98a1e','#6d597a','#2a9d8f','#9c6644'];
const NS_NGHI={low:'Thấp',medium:'Vừa',high:'Cao'};
const NS_CC={Read:'đọc tệp',Write:'tạo tệp',Edit:'sửa tệp',Bash:'chạy lệnh',Glob:'tìm tệp',Grep:'tìm chữ',WebSearch:'tìm trên web',WebFetch:'đọc trang web'};
const NS_KHUON=`Em là <tên>, <chức danh> của kênh Tâm Cơ ("Hiểu chiêu để không trúng chiêu.").

Đọc: <những tệp cần đọc trước khi làm>.

Việc:
1. <việc chính, ghi ra tệp nào>
2. <yêu cầu chất lượng, giới hạn>

Không đụng tôn giáo, chính trị, luật pháp. Báo cáo tối đa 3 câu: đã làm gì, tệp nào, còn vướng gì.`;
async function napDoi(){const r=await api('/api/doi-ngu');if(r.ds)S.doi=r.ds;return S.doi;}
async function nsNapHet(){const [d,k,g]=await Promise.all([napDoi(),api('/api/skill-ds'),api('/api/da-go')]);S.ns={...(S.ns||{tab:'nv'}),skill:k.ds||[],cc:k.cong_cu||[],khoa:k.khoa||[],dago:g.ds||[]};}
const nsTrongLuong=id=>{const d=(S.luDuLieu||null)||luDeXuat();return d.ds.flatMap(f=>f.buoc.filter(b=>b.ai===id).map(b=>`${f.ten.split(' · ')[0]}: ${b.ten}`));};
VE.nhansu=async function(){
  if(!S.ns?.skill)await nsNapHet();if(S.view!=='nhansu')return;
  const N=S.ns,ds=S.doi.filter(m=>m.id!=='dai-ca'),tab=N.tab||'nv';
  const chip=s=>`<span class="sk-chip${s.co===false?' thieu':s.gian_tiep?' gt':''}" title="${esc(s.de||'')}${s.co===false?' · chưa cài':''}">${esc(s.ten)}</span>`;
  const theNV=m=>{const khoa=N.khoa.includes(m.id);return `<article class="nv-the">
    <div class="nv-dau">${av(m.id)}<div class="nv-ten"><b>${esc(m.ten)}</b><span>${esc(m.chuc_danh)}</span></div>${m.loai==='ai'?`<span class="nv-model">${esc(m.model||'opus')}</span>`:m.loai==='may'?'<span class="nv-model">script</span>':''}</div>
    <div class="nv-phong"><span style="background:${esc(m.mau)}"></span>${esc(m.phong||'')}</div>
    <p class="nv-viec">${esc(m.viec||'')}</p>
    ${m.loai==='may'?'<div class="nv-nho">Script tự động, không dùng skill.</div>':`<div class="nv-sk">${(m.skill||[]).map(chip).join('')||'<span class="nv-nho">Chưa có skill</span>'}</div>`}
    ${m.cong_cu?`<div class="nv-cc">${m.cong_cu.split(/\s*,\s*/).map(c=>`<code>${esc(c)}</code>`).join('')}</div>`:''}
    <div class="nv-chan"><button class="nut be" data-ns="sua-nv" data-k="${esc(m.id)}">Sửa</button>${khoa?'<span class="nv-khoa" title="Nhân sự cốt lõi, không xoá được">🔒 cốt lõi</span>':`<button class="nut be nv-xoa" data-ns="xoa-nv" data-k="${esc(m.id)}">Xoá</button>`}</div></article>`;};
  const theSK=s=>`<article class="sk-the">
    <div class="sk-dau"><code>${esc(s.ten)}</code>${s.tu_web?'<span class="the-nhan lam">thêm từ web</span>':''}</div>
    <p>${esc(s.mo_ta||s.mo_ta_goc||'Chưa có mô tả')}</p>
    <div class="sk-meta"><span>${s.so_tep} tệp · ${s.kb} KB</span>${s.nguon?`<span class="sk-nguon" title="${esc(s.nguon)}">${esc(s.nguon.replace(/^https?:\/\/(www\.)?/,''))}</span>`:''}</div>
    <div class="sk-ai">${s.dung_boi.length?s.dung_boi.map(id=>`<span title="${esc(hoTen(id))}">${av(id)}</span>`).join('')+`<em>${s.dung_boi.map(id=>esc(nv(id).ten)).join(', ')}</em>`:'<em>Chưa ai dùng</em>'}</div>
    <div class="nv-chan"><button class="nut be" data-ns="sua-skill" data-k="${esc(s.ten)}">Xem · sửa</button><button class="nut be nv-xoa" data-ns="xoa-skill" data-k="${esc(s.ten)}">Xoá</button></div></article>`;
  const luc=t=>t?`${t.slice(6,8)}/${t.slice(4,6)} ${t.slice(9,11)}:${t.slice(11,13)}`:'';
  $('#view').innerHTML=`<div class="dau"><div><h1>Skill &amp; nhân sự</h1><p>Thêm, sửa, gỡ nhân viên AI và bộ skill của họ. Thay đổi ghi thẳng vào hệ thống.</p></div><div class="phai"><button class="nut" data-ns="them-skill">+ Skill</button><button class="nut chinh" data-ns="them-nv">+ Nhân viên</button></div></div>
   ${N.doi_phien?`<div class="ns-bao lam"><span>Nhân sự vừa thay đổi. Agent mới hoặc vừa sửa có hiệu lực từ <b>phiên mới</b> của anh Hải.</span><span style="flex:1"></span><button class="nut be" data-ns="phien-moi">Mở phiên mới</button><button class="nut be" data-ns="an-bao">Để sau</button></div>`:''}
   <div class="ns-tab" role="tablist">${[['nv','Nhân sự',ds.length],['sk','Kho skill',N.skill.length],['go','Đã gỡ',N.dago.length]].map(([k,t,n])=>`<button role="tab" data-ns="tab" data-k="${k}" class="${tab===k?'on':''}">${t}<i>${n}</i></button>`).join('')}</div>
   ${tab==='nv'?`<div class="nv-luoi">${ds.map(theNV).join('')}</div>`
    :tab==='sk'?`<div class="nv-luoi">${N.skill.map(theSK).join('')}</div><p class="mo" style="font-size:12.5px;margin-top:12px">Skill gồm nhiều tệp (thư mục <code>references</code>, <code>scripts</code>…) thì chép tay vào <code>.claude/skills/</code>; trang này sẽ tự nhận.</p>`
    :`<div class="the">${N.dago.length?N.dago.map(x=>`<div class="go-dong"><span class="the-nhan ${x.loai==='skill'?'lam':'cam'}">${x.loai==='skill'?'Skill':'Nhân viên'}</span><b>${esc(x.ten||x.id)}</b>${x.chuc_danh?`<span class="mo">${esc(x.chuc_danh)}</span>`:''}<span style="flex:1"></span><span class="mo">gỡ lúc ${luc(x.luc)}</span><button class="nut be" data-ns="khoi-phuc" data-loai="${x.loai}" data-k="${esc(x.ma)}">Khôi phục</button></div>`).join(''):'<p class="mo">Chưa gỡ gì. Nhân viên và skill bị xoá được giữ ở <code>dieu-hanh/_da-go/</code>, khôi phục được.</p>'}</div>`}`;
  $('#view').onclick=nsBam;
};
async function nsBam(e){const b=e.target.closest('[data-ns]');if(!b||S.view!=='nhansu')return;const a=b.dataset.ns,k=b.dataset.k,N=S.ns;
  if(a==='tab'){N.tab=k;return VE.nhansu();}
  if(a==='them-nv')return nsNganNV(null);
  if(a==='sua-nv')return nsNganNV(k);
  if(a==='them-skill')return nsNganSK(null);
  if(a==='sua-skill')return nsNganSK(k);
  if(a==='an-bao'){N.doi_phien=0;return VE.nhansu();}
  if(a==='phien-moi'){const r=await post('/api/phien-moi');if(r.loi){bao(r.loi);return;}N.doi_phien=0;bao('Đã mở phiên mới cho anh Hải');return VE.nhansu();}
  if(a==='xoa-nv'){if(S.luDuLieu===undefined){const l=await api('/api/luong');S.luDuLieu=l.luong||null;}const m=nv(k),viec=nsTrongLuong(k);
    if(!await hoi(`Gỡ ${m.ten}?`,(viec.length?`${m.ten} đang làm ${viec.length} bước trong luồng (${viec.slice(0,3).join('; ')}${viec.length>3?'…':''}). Gỡ xong các bước đó cần giao người khác. `:'')+'File agent được chuyển vào mục Đã gỡ, khôi phục được.','Gỡ'))return;
    const r=await post('/api/nhan-su/xoa',{id:k});if(r.loi){bao(r.loi);return;}N.doi_phien=1;S.luDuLieu=undefined;bao('Đã gỡ '+m.ten+(r.buoc_chuyen?` · ${r.buoc_chuyen} bước trong luồng chuyển về anh Hải`:''));await nsNapHet();return VE.nhansu();}
  if(a==='xoa-skill'){const s=N.skill.find(x=>x.ten===k);
    if(!await hoi(`Gỡ skill ${k}?`,(s?.dung_boi.length?`Đang dùng bởi ${s.dung_boi.map(id=>nv(id).ten).join(', ')}; skill sẽ được gỡ khỏi họ. `:'')+'Thư mục skill được chuyển vào mục Đã gỡ, khôi phục được.','Gỡ'))return;
    const r=await post('/api/skill/xoa',{ten:k});if(r.loi){bao(r.loi);return;}N.doi_phien=1;bao('Đã gỡ skill '+k);await nsNapHet();return VE.nhansu();}
  if(a==='khoi-phuc'){const r=await post('/api/khoi-phuc',{loai:b.dataset.loai,ma:k});if(r.loi){bao(r.loi);return;}N.doi_phien=1;bao('Đã khôi phục '+r.ten);await nsNapHet();return VE.nhansu();}
}
/* ---- ngăn kéo bên phải ---- */
function nsMoNgan(html,luu){let n=$('#ns-ngan');if(!n){n=document.createElement('div');n.id='ns-ngan';document.body.appendChild(n);}
  n.innerHTML=`<div class="ngan-nen" data-dong></div><aside class="ngan" role="dialog" aria-modal="true">${html}<div class="ngan-chan"><span class="ngan-loi" id="ngan-loi"></span><button class="nut" data-dong>Huỷ</button><button class="nut chinh" id="ngan-luu">Lưu</button></div></aside>`;
  requestAnimationFrame(()=>n.classList.add('mo'));
  const dong=()=>{n.classList.remove('mo');setTimeout(()=>{n.innerHTML='';},220);document.removeEventListener('keydown',esc_);};
  const esc_=e=>{if(e.key==='Escape')dong();};document.addEventListener('keydown',esc_);
  n.querySelectorAll('[data-dong]').forEach(x=>x.onclick=dong);
  const nut=$('#ngan-luu');nut.onclick=async()=>{$('#ngan-loi').textContent='';nut.disabled=true;nut.textContent='Đang lưu…';
    try{const r=await luu();if(r?.loi){$('#ngan-loi').textContent=r.loi;return;}dong();}finally{nut.disabled=false;nut.textContent='Lưu';}};
  n.querySelector('input,textarea')?.focus();return n;}
async function nsNganNV(id){
  const N=S.ns,m=id?await api('/api/nhan-su?id='+encodeURIComponent(id)):{ten:'',chuc_danh:'',phong:'',mau:NS_MAU[(S.doi.length)%NS_MAU.length],viec:'',loai:'ai',muc_nghi:'medium',luot:10,cong_cu:['Read','Write'],mo_ta:'',loi_dan:'',skill:[]};
  if(m.loi){bao(m.loi);return;}
  const ai=m.loai==='ai',agent=ai&&id!=='truong-nhom',coSk=m.loai!=='nguoi'&&id!=='may-dung',ganSk=Object.fromEntries((m.skill||[]).map(s=>[s.ten,s]));
  const phong=[...new Set(S.doi.map(x=>x.phong).filter(Boolean))];
  const n=nsMoNgan(`<header class="ngan-dau"><div class="ngan-av" id="ng-av">${id?av(id):''}</div><div><h2>${id?'Sửa '+esc(m.ten):'Thêm nhân viên'}</h2><p class="mo">${id?`Mã <code>${esc(id)}</code>`:'Mã tự tạo từ tên, không đổi được sau này'}</p></div></header>
   <section class="ngan-muc"><h3>Thông tin</h3><div class="ns-o">
     <label>Tên<input type="text" id="f-ten" value="${esc(m.ten)}" placeholder="vd: Hà" maxlength="40"></label>
     <label>Chức danh<input type="text" id="f-cd" value="${esc(m.chuc_danh)}" placeholder="vd: Dịch phụ đề" maxlength="60"></label>
     <label>Phòng<input type="text" id="f-phong" list="ds-phong" value="${esc(m.phong)}" maxlength="40"><datalist id="ds-phong">${phong.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label>
     <label>Màu<div class="mau-chon" id="f-mau" data-v="${esc(m.mau)}">${[...new Set([...NS_MAU,m.mau])].map(c=>`<button type="button" style="background:${c}" data-mau="${c}" class="${c===m.mau?'on':''}" aria-label="Màu ${c}"></button>`).join('')}</div></label>
     <label class="rong">Việc (hiện trên thẻ)<input type="text" id="f-viec" value="${esc(m.viec)}" maxlength="300" placeholder="Một câu: người này làm gì"></label></div></section>
   ${agent?`<section class="ngan-muc"><h3>Cách làm việc</h3><div class="ns-o">
     <label>Mức suy nghĩ<div class="phan-doan" id="f-nghi">${Object.entries(NS_NGHI).map(([k,t])=>`<button type="button" data-v="${k}" class="${k===m.muc_nghi?'on':''}">${t}</button>`).join('')}</div></label>
     <label>Lượt tối đa<input type="text" inputmode="numeric" id="f-luot" value="${esc(m.luot)}" placeholder="10"></label>
     <label class="rong">Công cụ được dùng<div class="cc-chon" id="f-cc">${N.cc.map(c=>`<button type="button" data-v="${c}" class="${m.cong_cu.includes(c)?'on':''}"><b>${c}</b><span>${NS_CC[c]||''}</span></button>`).join('')}</div></label>
     <label class="rong">Mô tả cho anh Hải (khi nào gọi người này)<input type="text" id="f-mota" value="${esc(m.mo_ta)}" maxlength="400" placeholder="Để trống: tự ghép từ tên, chức danh, việc"></label></div></section>
   <section class="ngan-muc"><h3>Lời dặn việc <button type="button" class="nut be" id="f-khuon" style="float:right">Điền khung mẫu</button></h3>
     <textarea id="f-loidan" class="mono" rows="12" placeholder="Họ là ai, đọc gì, làm gì, ghi ra tệp nào, báo cáo thế nào">${esc(m.loi_dan)}</textarea></section>`
   :id==='truong-nhom'?'<section class="ngan-muc"><p class="mo">Anh Hải là phiên chính; lời dặn nằm ở <code>CLAUDE.md</code>, model chỉnh ở mục Hệ thống.</p></section>':''}
   ${coSk?`<section class="ngan-muc"><h3>Skill <span class="mo" style="font-weight:400">${N.skill.length} trong kho</span></h3>${N.skill.length?N.skill.map(s=>{const c=ganSk[s.ten];return `<label class="sk-gan${c?' on':''}"><input type="checkbox" value="${esc(s.ten)}"${c?' checked':''}><span><code>${esc(s.ten)}</code><small>${esc(s.mo_ta||'')}</small></span><input type="text" data-de="${esc(s.ten)}" value="${esc(c?.de||'')}" placeholder="dùng để làm gì trong việc này"${c?.gian_tiep?' data-gt="1"':''}></label>`;}).join(''):'<p class="mo">Kho chưa có skill nào.</p>'}</section>`:''}`,
   async()=>{const b={id:id||'',ten:$('#f-ten').value,chuc_danh:$('#f-cd').value,phong:$('#f-phong').value,mau:$('#f-mau').dataset.v,viec:$('#f-viec').value};
     if(agent){b.muc_nghi=$('#f-nghi .on')?.dataset.v||'medium';b.luot=$('#f-luot').value.trim();b.cong_cu=[...$$('#f-cc .on')].map(x=>x.dataset.v);b.mo_ta=$('#f-mota').value;b.loi_dan=$('#f-loidan').value;}
     if(coSk)b.skill=[...$$('.sk-gan input[type=checkbox]:checked')].map(x=>{const d=$(`.sk-gan [data-de="${x.value}"]`);return {ten:x.value,de:d.value,...(d.dataset.gt?{gian_tiep:true}:{})};});
     const r=await post('/api/nhan-su',b);if(r.loi)return r;
     S.ns.doi_phien=1;bao(r.moi?'Đã thêm '+b.ten:'Đã lưu '+b.ten);await nsNapHet();if(S.view==='nhansu')VE.nhansu();}
  );
  n.querySelector('#f-mau').onclick=e=>{const c=e.target.closest('[data-mau]');if(!c)return;e.preventDefault();n.querySelectorAll('#f-mau button').forEach(x=>x.classList.toggle('on',x===c));$('#f-mau').dataset.v=c.dataset.mau;};
  n.querySelector('#f-nghi')?.addEventListener('click',e=>{const c=e.target.closest('[data-v]');if(!c)return;e.preventDefault();n.querySelectorAll('#f-nghi button').forEach(x=>x.classList.toggle('on',x===c));});
  n.querySelector('#f-cc')?.addEventListener('click',e=>{const c=e.target.closest('[data-v]');if(!c)return;e.preventDefault();c.classList.toggle('on');});
  n.querySelector('#f-khuon')?.addEventListener('click',async()=>{const t=$('#f-loidan');if(t.value.trim()&&!await hoi('Điền khung mẫu?','Lời dặn hiện có sẽ bị thay bằng khung mẫu.','Thay'))return;t.value=NS_KHUON.replace('<tên>',$('#f-ten').value||'<tên>').replace('<chức danh>',($('#f-cd').value||'<chức danh>').toLowerCase());t.focus();});
  n.querySelectorAll('.sk-gan input[type=checkbox]').forEach(x=>x.onchange=()=>x.closest('.sk-gan').classList.toggle('on',x.checked));
}

   <section class="ngan-muc"><div class="ns-o">

function luVeNet(f){
  const lb=$('#lb'),svg=$('#lb-net'),lop=$('#lb-nhan'),cot=$('#lb-cot');if(!lb||!svg||!cot)return;

    return {l:r.left-R.left,r:r.right-R.left,t:r.top-R.top,b:r.bottom-R.top,cx:(r.left+r.right)/2-R.left,cy:(r.top+r.bottom)/2-R.top};};
  const ci=Object.fromEntries(f.giai_doan.map((g,i)=>[g.id,i])),bi=Object.fromEntries(f.buoc.map(b=>[b.id,b]));
  const trongCot=id=>f.buoc.filter(b=>b.gd===bi[id].gd).findIndex(b=>b.id===id);
  const day=cot.getBoundingClientRect().bottom-R.top;let lan=0,sn=0,ds='',nh='';
  f.noi.forEach(e=>{if(!bi[e.tu]||!bi[e.den]||e.tu===e.den)return;const A=hop(e.tu),B=hop(e.den);if(!A||!B)return;
    const ca=ci[bi[e.tu].gd],cb=ci[bi[e.den].gd];let d,mx,my;
    if(cb>ca){const c=Math.max(36,(B.l-A.r)/2);d=`M${A.r} ${A.cy} C${A.r+c} ${A.cy} ${B.l-c} ${B.cy} ${B.l-3} ${B.cy}`;mx=(A.r+B.l)/2;my=(A.cy+B.cy)/2;}
    else if(cb<ca-1){const y=day+(++lan)*20-6,r=8;d=`M${A.cx} ${A.b} V${y-r} Q${A.cx} ${y} ${A.cx-r} ${y} H${B.cx+r} Q${B.cx} ${y} ${B.cx} ${y-r} V${B.b+3}`;mx=(A.cx+B.cx)/2;my=y;}
    else if(cb===ca-1){const c=Math.max(36,(A.l-B.r)/2);d=`M${A.l} ${A.cy} C${A.l-c} ${A.cy} ${B.r+c} ${B.cy} ${B.r+3} ${B.cy}`;mx=(A.l+B.r)/2;my=(A.cy+B.cy)/2;}
    else if(B.t>A.b&&trongCot(e.den)===trongCot(e.tu)+1){d=`M${A.cx} ${A.b} V${B.t-3}`;mx=A.cx+(e.nhan?60:0);my=(A.b+B.t)/2;}
    else if(B.t>A.b){d=`M${A.r} ${A.cy} C${A.r+44} ${A.cy} ${B.r+44} ${B.cy} ${B.r+3} ${B.cy}`;mx=A.r+33;my=(A.cy+B.cy)/2;}
    else{d=`M${A.l} ${A.cy} C${A.l-44} ${A.cy} ${B.l-44} ${B.cy} ${B.l-3} ${B.cy}`;mx=A.l-33;my=(A.cy+B.cy)/2;}
    const k=e.kieu in LB_MAU?e.kieu:'chinh',c=LB_MAU[k];
    const lien=`data-tu="${esc(e.tu)}" data-den="${esc(e.den)}"`,dur=(2.2+(sn%4)*.35).toFixed(2),tre=((sn++*0.53)%2.2).toFixed(2);
    ds+=`<g class="lb-e k-${k}" ${lien}><path class="net" d="${d}" style="stroke:${c};color:${c}"${k==='chinh'?'':' stroke-dasharray="6 5"'} marker-end="url(#lbm-${k})"/>`
      +`<circle class="hat" r="${k==='chinh'?3.2:2.6}" style="fill:${c};color:${c}"><animateMotion dur="${dur}s" begin="-${tre}s" repeatCount="indefinite" path="${d}"/></circle></g>`;
    if(e.nhan)nh+=`<span class="lb-tag" ${lien} style="left:${mx}px;top:${my}px;color:${c};border-color:${c}">${esc(e.nhan)}</span>`;});
  svg.setAttribute('width',lb.scrollWidth);svg.setAttribute('height',lb.scrollHeight);

  lop.innerHTML=nh;
}

function veChatDau(){const t=ttCua('truong-nhom');$('#chat-av').innerHTML=chanDung('truong-nhom');$('#chat-ten').textContent=nv('truong-nhom').ten;
  $('#chat-tt').textContent=`${nv('truong-nhom').chuc_danh} · ${TT[t.trang_thai]}`;
  const chay=S.phien.dang_chay;$('#gui').innerHTML=ic(chay?'dung':'gui');$('#gui').classList.toggle('dung',!!chay);$('#gui').title=chay?'Dừng':'Gửi';
  $('#hd').innerHTML=chay?`<span class="nhip"></span><span>${esc(S.phien.hoat_dong||'Anh Hải đang làm…')}</span>`:'';
  $('#phien-tt').textContent=chay?(S.phien.xep_hang?`${S.phien.xep_hang} lệnh xếp hàng`:'Anh Hải đang làm'):S.phien.noi_tiep?'Đang nối tiếp phiên trước':'Phiên mới';}
function veFab(){$('#fab').innerHTML=ic('chat')+(S.chuaDoc?`<span class="so">${S.chuaDoc}</span>`:'');}
async function dung(){if(!await hoi('Dừng anh Hải?','Việc đang chạy sẽ bị ngắt giữa chừng, các lệnh xếp hàng cũng bị huỷ.','Dừng'))return;await post('/api/dung');}
async function gui(){if(S.phien.dang_chay&&!$('#o').value.trim())return dung();const t=$('#o').value.trim();if(!t)return;$('#o').value='';caoO();await post('/api/lenh',{noi:t}).then(r=>{if(r.loi)bao(r.loi);else if(r.xep_hang)bao(`Đã xếp hàng (${r.xep_hang})`);});}
function caoO(){const o=$('#o');o.style.height='auto';o.style.height=Math.min(160,o.scrollHeight)+'px';}
$('#o').addEventListener('input',()=>{caoO();$('#gui').innerHTML=ic($('#o').value.trim()||!S.phien.dang_chay?'gui':'dung');});
$('#o').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();gui();}});
$('#gui').onclick=gui;
$('#goi-y').innerHTML=[['tiếp','tiếp',1],['/goi-y','/goi-y',1],['/chu-de ','/chu-de …',0],['/sua ','/sua …',0],['/phan-tich ','/phan-tich …',0],['/token','/token',1]].map(([v,t,g])=>`<button data-chen="${v}" data-gui="${g}">${t}</button>`).join('');
$('#goi-y').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#o').value=b.dataset.chen;if(b.dataset.gui==='1')gui();else{$('#o').focus();caoO();}};
$('#phien-moi').onclick=async()=>{if(!await hoi('Mở phiên mới?','Anh Hải quên nội dung trò chuyện trước (trạng thái công việc vẫn nằm trong file). Nên làm trước mỗi chủ đề mới.','Mở phiên mới'))return;const r=await post('/api/phien-moi');bao(r.ok?'Đã mở phiên mới':r.loi);napTT();};
$('#fab').onclick=()=>{document.body.classList.add('mo-chat');S.chuaDoc=0;veFab();$('#luong').scrollTop=1e9;};
$('#dong-chat').onclick=()=>document.body.classList.remove('mo-chat');
function veGD(){const t=document.documentElement.dataset.theme;$('#giaodien').innerHTML=ic('trang')+(t==='dark'?'Giao diện sáng':'Giao diện tối');}
$('#giaodien').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('giaodien',t);}catch{}veGD();VP?.chuDe(t==='dark');};

/* ================= CẬP NHẬT TRỰC TIẾP ================= */
let henTT;const napSau=(ms=800)=>{clearTimeout(henTT);henTT=setTimeout(()=>{napTT();napDuAn();},ms);};
// tab ẩn thì đóng luồng sự kiện, nhường kết nối cho video (trình duyệt chỉ cho ~6 kết nối tới một máy chủ)
let es;const moLuong=()=>{if(es)return;es=new EventSource('/api/stream');es.onmessage=nhanSuKien;};
document.addEventListener('visibilitychange',()=>{if(document.hidden){es?.close();es=null;}else{moLuong();napSau(300);}});
function nhanSuKien(ev){let d;try{d=JSON.parse(ev.data);}catch{return;}
  if(d.loai==='trang-thai'){S.nv[d.id]={...(S.nv[d.id]||{id:d.id}),trang_thai:d.trang_thai,ts:d.ts,...(d.viec!==undefined?{viec:d.viec}:{})};
    const e=$(`.tram[data-id="${d.id}"]`);if(e&&S.view==='ban'){const t=ttCua(d.id);e.dataset.tt=t.trang_thai;e.querySelector('.bong').textContent=t.viec||TT[t.trang_thai];e.querySelector('.tt').textContent=TT[t.trang_thai];}
    veChatDau();dongBoVP();if(d.id==='truong-nhom')napSau();}
  else if(d.loai==='doi-ngu'){napDoi().then(()=>{if(S.view==='doingu')VE.doingu();else if(S.view==='nhansu'&&!$('#ns-ngan.mo'))nsNapHet().then(()=>S.view==='nhansu'&&VE.nhansu());});}
  else if(d.loai==='luong'){if(Date.now()-(S.luMinh||0)>3000){S.luDuLieu=undefined;if(S.view==='luong')VE.luong();}}
  else if(d.loai==='tien-do'){S.tienDo=d;S.nv['may-dung']={...(S.nv['may-dung']||{}),id:'may-dung',trang_thai:d.phan_tram>=100?'onl':'lam',viec:d.viec};veBanDong();kiemBao();}
  else if(d.loai==='tin'){themTin(d);bayThu(d.tu,d.den);if(d.tu==='may-dung'||d.den==='dai-ca')napSau(1200);}
  else if(d.loai==='hoat-dong'){S.phien.hoat_dong=d.noi;veChatDau();const e=$('.tram[data-id="truong-nhom"] .bong');if(e)e.textContent=d.noi;VP?.trangThai('truong-nhom','lam',d.noi);}
  else if(d.loai==='phien'){const truoc=S.phien.dang_chay;S.phien=d;veChatDau();kiemBao();if(truoc!==d.dang_chay){napSau(500);if(!d.dang_chay&&['duyet','dangbai','chude','phantich'].includes(S.view)&&!$$('#view textarea').some(t=>t.value.trim()))setTimeout(()=>VE[S.view](),900);}}
}
moLuong();
setInterval(()=>{if(!document.hidden)napTT();},30000);
// tab ẩn thì luồng sự kiện đóng: vẫn hỏi trạng thái mỗi 15 giây để âm báo kêu được
setInterval(()=>{if(document.hidden&&window.NHAC?.baoBat())napTT();},15000);

(async()=>{veGD();veFab();S.doi=(await api('/api/doi-ngu')).ds;await Promise.all([napTT(),napDuAn()]);napTin();mo(location.hash.slice(1)||'ban',1);})();
})();
</script>
<script src="/nhac.js"></script>
</body>
</html>
