<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng 3D – Bản Lĩnh Mềm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  VĂN PHÒNG 3D – PHÒNG ĐIỀU HÀNH BẢN LĨNH MỀM
  Dựng bằng CSS 3D thuần, không thư viện ngoài, nhẹ cho MacBook Pro 2017 (Intel HD 630).

  Hai chế độ:
  - DEMO: tự chạy một ca làm việc mẫu (mặc định khi mở file trực tiếp hoặc thêm #demo).
  - LIVE: khi chạy qua server dieu-hanh (http://localhost:4747/van-phong-3d.html), trang gọi
      GET  /api/trang-thai   -> {"nhan_vien":[{"id","trang_thai","viec","model"}...]}
      SSE  /api/stream       -> mỗi event là 1 dòng JSON:
        {"loai":"trang-thai","id":"bien-kich","trang_thai":"lam|onl|off|cho|loi","viec":"...","model":"opus · high"}
        {"loai":"tin","tu":"truong-nhom","den":"bien-kich","noi":"..."}
        {"loai":"tien-do","id":"may-dung","phan_tram":42,"viec":"Render phần 1"}
  id hợp lệ: truong-nhom, len-chu-de, bien-kich, kiem-duyet, dao-dien, dong-goi, phan-tich, may-dung
-->
<style>
:root{
  --rx:58deg; --rz:-32deg;
  --bg1:#f3ece2; --bg2:#e2d6c6;
  --ink:#1f2328; --muted:#6b6f76;
  --panel:rgba(255,253,249,.92); --line:rgba(31,35,40,.10);
  --lam:#16a34a; --onl:#d4a017; --off:#9aa0a6; --cho:#ea7a1a; --loi:#dc2626;
  --font:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2));}
body.dem{--bg1:#2b3446;--bg2:#161b26}
#stage{position:fixed;inset:0;perspective:2400px;perspective-origin:50% 40%;cursor:grab;user-select:none}
#stage.keo{cursor:grabbing}
#cam{position:absolute;left:50%;top:54%;width:0;height:0;transform-style:preserve-3d}
#world{position:absolute;width:1100px;height:800px;left:-550px;top:-400px;transform-style:preserve-3d;
  transform-origin:550px 400px;}
.g{position:absolute;left:0;top:0;transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;backface-visibility:visible}
/* billboard */
.bb{position:absolute;width:0;height:0;transform-style:preserve-3d;pointer-events:none}
.bbi{position:absolute;left:0;bottom:0;transform:translateX(-50%);white-space:nowrap;display:flex;flex-direction:column;align-items:center}

/* floor */
.san{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 100px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 100px),
  linear-gradient(135deg,#d9c3a5,#cdb393);}
body.dem .san{filter:brightness(.62)}
.tham{border-radius:18px;background:repeating-linear-gradient(45deg,#7e9c8f 0 14px,#76948a 14px 28px);box-shadow:inset 0 0 0 6px #6b887c}

/* screen */
.manhinh{background:#0f1419;overflow:hidden}
.manhinh .dong{position:absolute;left:6%;height:7%;border-radius:2px;opacity:.0}
.bat .manhinh{background:#0d1b2a}
.bat .manhinh .dong{opacity:.9;animation:go 1.6s steps(6) infinite}
.cho-duyet .manhinh{background:#2a1a0d}
@keyframes go{0%{width:10%}100%{width:78%}}
.toi .manhinh{background:#05070a}

/* people */
.nguoi{transition:transform 2.2s cubic-bezier(.45,.05,.3,1)}
.nguoi .tay-l,.nguoi .tay-r{transition:transform .2s}
.nguoi.go .tay-l{animation:go-l .32s infinite alternate}
.nguoi.go .tay-r{animation:go-r .32s infinite alternate .16s}
@keyframes go-l{to{transform:translateZ(3px)}}
@keyframes go-r{to{transform:translateZ(3px)}}
.nguoi.di .than{animation:nhun .38s infinite alternate}
@keyframes nhun{to{transform:translateZ(3px)}}
.nguoi.an{visibility:hidden}
.ngoi .chan-dung{display:none}
.dung .chan-ngoi{display:none}

/* labels */
.nhan{font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;gap:6px;align-items:center;color:#1f2328}
.nhan i{width:8px;height:8px;border-radius:50%;display:inline-block}
.viec{margin-bottom:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;background:#1f2328;color:#fff;max-width:220px;
  overflow:hidden;text-overflow:ellipsis}
.bong{margin-bottom:6px;font-size:12.5px;line-height:1.35;font-weight:500;padding:8px 11px;border-radius:12px;background:#fff;color:#1f2328;
  box-shadow:0 6px 18px rgba(0,0,0,.22);white-space:normal;width:250px;position:relative;opacity:0;transform:translateY(6px);
  transition:opacity .25s,transform .25s}
.bong.hien{opacity:1;transform:none}
.bong:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bong b{display:block;font-size:11px;color:#6b6f76;margin-bottom:2px}
.thu{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center;font-size:14px}
.dongho{font:700 22px/1 var(--font);color:#1f2328}
.led{width:6px;height:6px;border-radius:50%;background:#2a2f36;position:absolute}
.may-chay .led{animation:led .5s infinite alternate}
@keyframes led{0%{background:#1f6f3a}100%{background:#5cff8a;box-shadow:0 0 6px #5cff8a}}
.thanh{width:120px;height:8px;border-radius:5px;background:rgba(0,0,0,.25);overflow:hidden;margin-bottom:4px}
.thanh div{height:100%;background:#22c55e;width:0;transition:width .4s}

/* HUD */
.hud{position:fixed;z-index:5;font-size:13px}
.panel{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 10px 30px rgba(40,30,20,.12)}
#top{top:14px;left:14px;right:14px;display:flex;align-items:center;gap:14px;padding:10px 14px}
#top h1{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
#top h1 span{color:#2f6f5e}
.dem-so{display:flex;gap:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.dem-so b{color:var(--ink)}
.cham{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:0}
.sp{flex:1}
.btn{font:600 12.5px var(--font);border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f6f1ea}
.btn.on{background:#1f2328;color:#fff;border-color:#1f2328}
#gio{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
#nv{top:74px;left:14px;width:300px;bottom:14px;padding:12px;overflow:auto}
#bt{top:74px;right:14px;width:330px;bottom:14px;padding:12px;display:flex;flex-direction:column}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:2px 4px 10px}
.the{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:9px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.the:hover{background:rgba(0,0,0,.035)}
.the.chon{border-color:#2f6f5e;background:rgba(47,111,94,.07)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;position:relative}
.av i{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.the .ten{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.the .vai{font-size:11.5px;color:var(--muted);font-weight:500}
.pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap;align-self:start}
.the .vl{font-size:12px;margin-top:3px;color:#33373d;line-height:1.35}
.the .md{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.the.fable .md span:first-child{color:var(--loi);font-weight:700}
#feed{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px 4px}
.tn{display:grid;grid-template-columns:28px 1fr;gap:8px;animation:vao .3s}
@keyframes vao{from{opacity:0;transform:translateY(6px)}}
.tn .av{width:28px;height:28px;font-size:12px;border-radius:8px}
.tn .dau{font-size:11.5px;color:var(--muted);font-weight:600}
.tn .dau b{color:var(--ink)}
.tn .nd{background:#fff;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:7px 10px;margin-top:3px;line-height:1.4;font-size:12.5px}
.tn.may .nd{background:#eef7f0;border-color:#cfe6d6;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
#goi-y{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;padding:7px 14px;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
#chitiet{position:fixed;z-index:6;left:330px;bottom:16px;width:290px;padding:14px;display:none}
#chitiet.hien{display:block}
#chitiet .x{float:right;cursor:pointer;color:var(--muted);font-weight:700}
#chitiet h3{font-size:15px;margin-bottom:2px}
#chitiet .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line)}
#chitiet .row span:first-child{color:var(--muted)}
@media (max-width:1100px){#nv{width:250px}#bt{width:270px}#chitiet{left:280px}}
@media (max-width:820px){#nv,#bt{display:none}#chitiet{left:14px}}
</style>
</head>
<body>
<div id="stage"><div id="cam"><div id="world"></div></div></div>

<div id="top" class="hud panel">
  <h1>Văn phòng <span>Bản Lĩnh Mềm</span></h1>
  <div class="dem-so">
    <span><i class="cham" style="background:var(--lam)"></i>Đang làm <b id="n-lam">0</b></span>
    <span><i class="cham" style="background:var(--onl)"></i>Online <b id="n-onl">0</b></span>
    <span><i class="cham" style="background:var(--off)"></i>Offline <b id="n-off">0</b></span>
  </div>
  <div class="sp"></div>
  <span id="gio"></span>
  <button class="btn" data-goc="toan">Toàn cảnh</button>
  <button class="btn" data-goc="tren">Từ trên</button>
  <button class="btn" data-goc="sep">Phòng Anh Hải</button>
  <button class="btn on" id="b-demo">▶ Demo</button>
  <button class="btn" id="b-toc">Tốc độ 1×</button>
</div>

<div id="nv" class="hud panel"><h2>Nhân viên</h2><div id="ds"></div></div>
<div id="bt" class="hud panel"><h2>Bản tin nội bộ</h2><div id="feed"></div></div>
<div id="chitiet" class="panel"></div>
<div id="goi-y" class="panel">Kéo để xoay · Cuộn để phóng to · Bấm vào nhân viên để xem chi tiết</div>

<script>
(()=>{
"use strict";
const W=document.getElementById('world'), CAM=document.getElementById('cam'), ST=document.getElementById('stage');
const $=s=>document.querySelector(s);

/* ---------- helpers ---------- */
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return `rgb(${c(r)},${c(g)},${c(b)})`;}
function el(tag,cls,parent,style){const e=document.createElement(tag);if(cls)e.className=cls;if(style)e.style.cssText=style;if(parent)parent.appendChild(e);return e;}
function grp(parent,x,y,z,extra){const g=el('div','g',parent);g.style.transform=`translate3d(${x}px,${y}px,${z||0}px)${extra||''}`;return g;}
/* box: x,y,z origin corner; w along x, d along y, h along z */
function box(parent,x,y,z,w,d,h,color,opt={}){
  const g=grp(parent,x,y,z);g.style.width=w+'px';g.style.height=d+'px';
  if(opt.cls)g.classList.add(...opt.cls.split(' '));
  const col=opt.colors||{};const bg=(k,f)=>col[k]||shade(color,f);
  const faces={};
  const mk=(name,css,b)=>{const f=el('div','f '+name,g,css+`;background:${b};`);if(opt.r)f.style.borderRadius=opt.r+'px';if(opt.alpha)f.style.opacity=opt.alpha;faces[name]=f;return f;};
  if(!opt.noTop)mk('top',`width:${w}px;height:${d}px;transform:translateZ(${h}px)`,bg('top',1));
  mk('front',`width:${w}px;height:${h}px;top:${d-h}px;transform-origin:0 100%;transform:rotateX(-90deg)`,bg('front',.86));
  if(!opt.noBack)mk('back',`width:${w}px;height:${h}px;top:${-h}px;transform-origin:0 100%;transform:rotateX(-90deg)`,bg('back',.7));
  mk('left',`width:${h}px;height:${d}px;transform-origin:0 0;transform:rotateY(-90deg)`,bg('left',.78));
  mk('right',`width:${h}px;height:${d}px;left:${w}px;transform-origin:0 0;transform:rotateY(-90deg)`,bg('right',.66));
  g.faces=faces;return g;
}
/* upright plane facing +y at (x,y), bottom at z */
function planeY(parent,x,y,z,w,h,css){const g=grp(parent,x,y,z);const p=el('div','f',g,`width:${w}px;height:${h}px;top:${-h}px;transform-origin:0 100%;transform:rotateX(-90deg);${css||''}`);return p;}
/* upright plane facing +x at (x,y..y+w), bottom at z */
function planeX(parent,x,y,z,w,h,css){const g=grp(parent,x,y+w,z);const p=el('div','f',g,`width:${w}px;height:${h}px;top:${-h}px;transform-origin:0 100%;transform:rotateZ(-90deg) rotateX(-90deg);${css||''}`);return p;}
function billboard(parent,x,y,z){const b=el('div','bb',parent);b.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateZ(calc(-1*var(--rz))) rotateX(calc(-1*var(--rx)))`;const i=el('div','bbi',b);b.inner=i;return b;}

/* ---------- staff ---------- */
const NV=[
 {id:'truong-nhom',ten:'Anh Hải',vai:'Trưởng nhóm',ao:'#2f6f5e',toc:'#241a14',da:'#e8b894',nu:false,ban:{x:120,y:110},quay:0,model:'opus · medium'},
 {id:'len-chu-de',ten:'Linh',vai:'Lên ý tưởng',ao:'#e07a5f',toc:'#3a241a',da:'#f1c7a4',nu:true,ban:{x:400,y:330},quay:0,model:'opus · medium'},
 {id:'bien-kich',ten:'Tuấn',vai:'Biên kịch',ao:'#3d5a80',toc:'#1d1612',da:'#e3b08c',nu:false,ban:{x:580,y:330},quay:0,model:'opus · high'},
 {id:'kiem-duyet',ten:'Chị Mai',vai:'Kiểm duyệt',ao:'#b5838d',toc:'#4a2c22',da:'#f0c3a2',nu:true,ban:{x:760,y:330},quay:0,model:'opus · medium'},
 {id:'dao-dien',ten:'Khoa',vai:'Đạo diễn hình ảnh',ao:'#5f8f74',toc:'#151110',da:'#d9a47e',nu:false,ban:{x:400,y:540},quay:0,model:'opus · medium'},
 {id:'dong-goi',ten:'Vy',vai:'Đóng gói đăng bài',ao:'#d9a441',toc:'#2c1b14',da:'#f3ccab',nu:true,ban:{x:580,y:540},quay:0,model:'opus · medium'},
 {id:'phan-tich',ten:'Đức',vai:'Phân tích số liệu',ao:'#6d597a',toc:'#201714',da:'#e0ae8a',nu:false,ban:{x:760,y:540},quay:0,model:'opus · high'},
];
const MAY={id:'may-dung',ten:'Máy dựng',vai:'Script blm (không tốn token)',ao:'#334155'};
const BY={};NV.forEach(n=>BY[n.id]=n);BY[MAY.id]=MAY;
const NHAN_TT={lam:'Đang làm',onl:'Online',off:'Offline',cho:'Chờ duyệt',loi:'Lỗi'};
const MAU_TT={lam:'var(--lam)',onl:'var(--onl)',off:'var(--off)',cho:'var(--cho)',loi:'var(--loi)'};
const PANTRY=[{x:870,y:150,q:180},{x:930,y:175,q:200},{x:840,y:205,q:160},{x:965,y:120,q:220},{x:900,y:228,q:170},{x:985,y:205,q:240},{x:820,y:150,q:150}];

/* ---------- build scene ---------- */
const FW=1100,FD=800;
const san=el('div','f san',W,`width:${FW}px;height:${FD}px;`);
el('div','f tham',W,`left:350px;top:285px;width:600px;height:420px;transform:translateZ(.5px)`);
// walls
box(W,-14,-14,0,FW+14,14,170,'#efe6da',{colors:{top:'#d8cbb8'}});
box(W,-14,0,0,14,FD,170,'#e9dfd1',{colors:{top:'#d8cbb8'}});
// windows back wall
const sky=[];
[[360,170],[560,170]].forEach(([x,w])=>{
  const p=planeY(W,x,1,52,w,90,'border:6px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 1px #cfc2b0');sky.push(p);
  el('div','',p,'position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff');
});
// logo + clock
const logo=planeY(W,770,1,70,200,60,'background:#2f6f5e;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font:800 19px var(--font);letter-spacing:.02em');
logo.textContent='BẢN LĨNH MỀM';
const dh=planeY(W,1000,1,90,56,56,'background:#fff;border-radius:50%;border:4px solid #1f2328;');
const kimH=el('div','',dh,'position:absolute;left:50%;top:50%;width:3px;height:14px;margin-left:-1.5px;background:#1f2328;transform-origin:50% 0;border-radius:2px');
const kimM=el('div','',dh,'position:absolute;left:50%;top:50%;width:2px;height:19px;margin-left:-1px;background:#c2410c;transform-origin:50% 0;border-radius:2px');
// left wall board
const bang=planeX(W,1,330,55,300,95,'background:#fbfaf7;border:6px solid #b9a88f;border-radius:4px;padding:10px 14px;font:600 13px/1.5 var(--font);color:#334155');
bang.innerHTML='<div style="font-weight:800;color:#2f6f5e;margin-bottom:4px">KẾ HOẠCH HÔM NAY</div>1. Kịch bản "Bị ghét ngầm"<br>2. 5 video mẫu · 5 logo';
// glass office (Anh Hải)
const glass={colors:{front:'rgba(190,225,235,.28)',back:'rgba(190,225,235,.18)',left:'rgba(190,225,235,.22)',right:'rgba(190,225,235,.28)',top:'rgba(255,255,255,.6)'}};
box(W,300,0,0,6,180,150,'#ffffff',glass);
box(W,0,250,0,200,6,150,'#ffffff',glass);
box(W,0,250,0,200,6,6,'#9aa5ad');box(W,300,0,0,6,180,6,'#9aa5ad');
el('div','f',W,'left:6px;top:6px;width:294px;height:244px;transform:translateZ(.6px);background:#cdb79a;border-radius:2px');
const bienSep=planeY(W,60,252,105,110,26,'background:#1f2328;color:#fff;font:700 12px/26px var(--font);text-align:center;border-radius:4px');bienSep.textContent='TRƯỞNG NHÓM';

// pantry
box(W,820,20,0,170,40,80,'#8a6f55',{colors:{top:'#cfc0aa'}}); // counter
box(W,835,25,80,40,30,38,'#3f3f46');        // coffee machine
box(W,900,25,80,26,26,30,'#e5e7eb');        // kettle
box(W,1040,30,0,36,36,110,'#dbeafe',{colors:{top:'#93c5fd'}}); // water cooler
box(W,850,250,0,150,60,36,'#64748b');box(W,850,290,0,150,20,70,'#56637a'); // sofa
box(W,1040,260,0,40,40,40,'#a16207');box(W,1043,263,40,34,34,55,'#3f7d4f',{r:14}); // plant
box(W,250,700,0,40,40,40,'#a16207');box(W,253,703,40,34,34,60,'#4a8a5b',{r:14});
box(W,1040,700,0,40,40,40,'#a16207');box(W,1043,703,40,34,34,48,'#3f7d4f',{r:14});
const tPan=billboard(W,905,140,150);tPan.inner.innerHTML='<div class="nhan" style="opacity:.85">☕ Góc nghỉ</div>';

// server rack (Máy dựng)
const rack=box(W,1040,410,0,48,70,150,'#1f2937',{cls:'rack'});
const rf=rack.faces.left;rf.style.background='#111827';
for(let i=0;i<10;i++){const l=el('div','led',rf,`left:${12+ (i%2)*12}px;top:${10+Math.floor(i/2)*12}px`);}
for(let i=0;i<6;i++){el('div','',rf,`position:absolute;left:44px;top:${10+i*10}px;width:90px;height:4px;background:#374151;border-radius:2px`);}
MAY.rack=rack;

function setPos(n,x,y,q,pose){n.p.style.transform=`translate3d(${x}px,${y}px,0) rotateZ(${q}deg)`;

function ngoiVao(n){setPos(n,n.ngoi.x,n.ngoi.y,0,'ngoi');}
let pantryUsed={};
function raNghi(n){let i=PANTRY.findIndex((p,k)=>!Object.values(pantryUsed).includes(k));if(i<0)i=0;pantryUsed[n.id]=i;const s=PANTRY[i];
  di(n,s.x,s.y,s.q,'dung');}
function di(n,x,y,q,pose){n.p.classList.add('di');n.p.classList.remove('ngoi');n.p.classList.add('dung');
  n.p.style.transform=`translate3d(${x}px,${y}px,0) rotateZ(${q}deg)`;clearTimeout(n.tdi);
  n.tdi=setTimeout(()=>{n.p.classList.remove('di');if(pose==='ngoi'){n.p.classList.add('ngoi');n.p.classList.remove('dung');}},2200/speed);}
function capNhat(id,tt,viec,model){
  const n=BY[id];if(!n)return;const cu=n.tt;n.tt=tt;if(viec!==undefined)n.viec=viec;if(model)n.model=model;
  if(cu!==tt)n.since=Date.now();
  if(n===MAY){rack.classList.toggle('may-chay',tt==='lam');
    MAY.lab.querySelector('.nhan i').style.background=MAU_TT[tt];if(tt!=='lam')$('#may-thanh div').style.width=tt==='onl'?'100%':'0';
    veDS();return;}
  const p=n.p;
  if(tt==='off'){p.classList.add('an');delete pantryUsed[n.id];ngoiVao(n);}
  else{
    const anTruoc=p.classList.contains('an');p.classList.remove('an');
    if(tt==='onl'){ if(anTruoc){setPos(n,560,790,180,'dung');requestAnimationFrame(()=>requestAnimationFrame(()=>raNghi(n)));} else if(n.vitri!=='nghi')raNghi(n); n.vitri='nghi';}
    else{ delete pantryUsed[n.id];
      if(anTruoc){setPos(n,560,790,180,'dung');requestAnimationFrame(()=>requestAnimationFrame(()=>di(n,n.ngoi.x,n.ngoi.y,0,'ngoi')));}
      else if(n.vitri!=='ban'){di(n,n.ngoi.x,n.ngoi.y,0,'ngoi');}
      else ngoiVao(n);
      n.vitri='ban';}
  }
  const dang=tt==='lam'||tt==='cho'||tt==='loi';
  n.mon.classList.toggle('bat',tt==='lam');n.mon.classList.toggle('cho-duyet',tt==='cho');
  n.mon.classList.toggle('toi',!dang);
  p.classList.toggle('go',tt==='lam');
  const lamp=n.den.faces.top;lamp.style.background=dang?'#fde68a':'#9ca3af';lamp.style.boxShadow=dang?'0 0 22px 8px rgba(253,230,138,.55)':'none';
  n.lab.querySelector('.nhan i').style.background=MAU_TT[tt];
  const v=n.lab.querySelector('.viec');
  if(dang&&n.viec){v.style.display='';v.textContent=(tt==='cho'?'⏳ ':tt==='loi'?'⚠ ':'⌨ ')+n.viec;v.style.background=tt==='cho'?'var(--cho)':tt==='loi'?'var(--loi)':'#1f2328';}
  else v.style.display='none';
  veDS();
}

function viTri(id){const n=BY[id];if(n===MAY)return{x:1064,y:445,z:150};
  if(n.vitri==='nghi'&&pantryUsed[id]!==undefined){const s=PANTRY[pantryUsed[id]];return{x:s.x,y:s.y,z:80};}
  return{x:n.ngoi.x,y:n.ngoi.y-30,z:100};}
function noi(tu,den,txt){
  const a=BY[tu],b=BY[den];if(!a)return;
  // bubble
  if(a!==MAY){const bg=a.lab.querySelector('.bong');bg.innerHTML=`<b>→ ${b?b.ten:''}</b>${txt}`;bg.classList.add('hien');clearTimeout(a.tb);a.tb=setTimeout(()=>bg.classList.remove('hien'),Math.max(2600,txt.length*55)/speed);}
  // plane
  if(b){const s=viTri(tu),e=viTri(den);const bb=billboard(W,s.x,s.y,s.z);bb.inner.innerHTML='<div class="thu">✉️</div>';
    const t0=performance.now(),dur=1300/speed;
    (function step(t){const k=Math.min(1,(t-t0)/dur),q=k*k*(3-2*k);
      const x=s.x+(e.x-s.x)*q,y=s.y+(e.y-s.y)*q,z=s.z+(e.z-s.z)*q+Math.sin(Math.PI*q)*120;
      bb.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateZ(calc(-1*var(--rz))) rotateX(calc(-1*var(--rx)))`;
      if(k<1)requestAnimationFrame(step);else bb.remove();})(t0);}
  // feed
  const f=$('#feed');const d=el('div','tn'+(a===MAY?' may':''),f);
  const gio=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML=`<div class="av" style="background:${a.ao}">${a===MAY?'⚙':a.ten.split(' ').pop()[0]}</div><div><div class="dau"><b>${a.ten}</b>${b?' → '+b.ten:''} · ${gio}</div><div class="nd"></div></div>`;
  d.querySelector('.nd').textContent=txt;
  while(f.children.length>60)f.firstChild.remove();
  f.scrollTop=f.scrollHeight;
}

/* ---------- camera ---------- */
let cam={rx:58,rz:-32,zoom:.78,px:0,py:0},muc={...cam};
function apCam(){const r=document.documentElement.style;r.setProperty('--rx',cam.rx+'deg');r.setProperty('--rz',cam.rz+'deg');
  W.style.transform=`translate3d(${cam.px}px,${cam.py}px,0) scale(${cam.zoom}) rotateX(${cam.rx}deg) rotateZ(${cam.rz}deg)`;}
function nhamToi(x,y,z){ // pan so that world point (x,y) ~ center
  const a=muc.rz*Math.PI/180;const dx=x-550,dy=y-400;
  const sx=dx*Math.cos(a)-dy*Math.sin(a), sy=dx*Math.sin(a)+dy*Math.cos(a);
  muc.zoom=z;muc.px=-sx*z;muc.py=-sy*z*Math.cos(muc.rx*Math.PI/180)+40;}
function vongCam(){let d=0;for(const k of['rx','rz','zoom','px','py']){const v=(muc[k]-cam[k])*.12;cam[k]+=v;d+=Math.abs(v);}
  if(d>.0005)apCam();requestAnimationFrame(vongCam);}
let keo=null;
ST.addEventListener('pointerdown',e=>{keo={x:e.clientX,y:e.clientY,rz:muc.rz,rx:muc.rx,px:muc.px,py:muc.py,pan:e.shiftKey||e.button===2};ST.classList.add('keo');ST.setPointerCapture(e.pointerId);});
ST.addEventListener('pointermove',e=>{if(!keo)return;const dx=e.clientX-keo.x,dy=e.clientY-keo.y;
  if(keo.pan){muc.px=keo.px+dx;muc.py=keo.py+dy;}else{muc.rz=keo.rz+dx*.3;muc.rx=Math.max(20,Math.min(80,keo.rx-dy*.25));}});
ST.addEventListener('pointerup',()=>{keo=null;ST.classList.remove('keo');});
ST.addEventListener('contextmenu',e=>e.preventDefault());
ST.addEventListener('wheel',e=>{e.preventDefault();muc.zoom=Math.max(.45,Math.min(2.4,muc.zoom*(e.deltaY>0?.92:1.08)));},{passive:false});
const GOC={toan:{rx:58,rz:-32,zoom:.78,px:0,py:0},tren:{rx:22,rz:0,zoom:.72,px:0,py:0}};
document.querySelectorAll('[data-goc]').forEach(b=>b.onclick=()=>{const g=b.dataset.goc;if(g==='sep'){muc.rx=55;muc.rz=-25;nhamToi(170,140,1.6);}else Object.assign(muc,GOC[g]);});
